<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Costos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .analisis-img {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            margin-top: 20px;
            border: 1px solid #eaeaea;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="producto-titulo">Análisis de Costos</h1>
        <p>Detalle financiero del producto seleccionado.</p>
        
        <!-- Aquí se cargará la imagen del análisis dinámicamente -->
        <img id="analisis-imagen" src="" alt="Cargando análisis..." class="analisis-img">
        
        <br>
        <a href="index.html" class="btn-back">⬅️ Volver al Catálogo</a>
    </div>

    <script>
        // Capturar los parámetros ID y Nombre desde la URL
        const valoresURL = window.location.search;
        const urlParams = new URLSearchParams(valoresURL);
        const id = urlParams.get('id');
        const nombre = urlParams.get('nombre');

        // Mostrar el nombre del producto en el título
        if (nombre) {
            document.getElementById('producto-titulo').innerText = "Análisis: " + nombre;
        }

        // Asignar la imagen del análisis de costos según el ID del producto
        const imagenAnalisis = document.getElementById('analisis-imagen');
        
        if (id === "1") {
            imagenAnalisis.src = "imagenes/analisis-zanahoria.jpeg"; // Cambia por la ruta real de tu imagen
        } else if (id === "2") {
            imagenAnalisis.src = "imagenes/analisis-yogur.jpeg";     // Cambia por la ruta real de tu imagen
        } else {
            imagenAnalisis.alt = "No se encontró el análisis de costos para este producto.";
        }
    </script>
</body>
</html>
